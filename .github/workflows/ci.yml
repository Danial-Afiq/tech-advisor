name: CI

# Run CI for pull requests targeting main
# and again whenever code is pushed/merged into main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI only needs permission to read repository contents
permissions:
  contents: read

jobs:
  backend:
    name: Backend - Test and Build
    runs-on: ubuntu-latest

    # Start a temporary PostgreSQL service for backend tests
    # This database exists only for this GitHub Actions run
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: techadvisor_test
          POSTGRES_USER: techadvisor
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432

        # Wait until PostgreSQL is ready before running backend tests
        options: >-
          --health-cmd "pg_isready -U techadvisor -d techadvisor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Environment variables used by Spring Boot to connect
    # to the temporary PostgreSQL service above
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: techadvisor_test
      POSTGRES_USER: techadvisor
      POSTGRES_PASSWORD: devpassword

    steps:
      # Download the repository onto the GitHub Actions runner
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install Java 21 for the Spring Boot backend
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Run backend tests first, then build the application
      - name: Test and build backend
        shell: bash
        run: |
          # Allow CI to continue before the Spring Boot backend exists
          if [ ! -f backend/pom.xml ]; then
            echo "backend/pom.xml not found yet - backend CI skipped until Spring Boot is initialised."
            exit 0
          fi

          cd backend
          export JWT_SECRET="$(openssl rand -base64 32)"

          # Prefer the Maven Wrapper so developers do not need
          # the same Maven version installed manually
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw test
            ./mvnw package -DskipTests
          else
            mvn test
            mvn package -DskipTests
          fi
      
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the GitHub Actions runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Node.js for the React/TypeScript frontend
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Install dependencies, run available tests, and build the frontend
      - name: Test and build frontend
        shell: bash
        run: |
          # Allow CI to continue before the React frontend exists
          if [ ! -f frontend/package.json ]; then
            echo "frontend/package.json not found yet - frontend CI skipped until React is initialised."
            exit 0
          fi

          cd frontend

          # Use npm ci when a lock file exists for reproducible installs
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          # Run tests
          npm run lint
          npm test
          npm run build

  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    # Always run the existing Repository Checks job so it can report a CI failure
    # without creating a separate Telegram check.
    if: always()

    steps:
      # Download the repository so setup files can be checked
      - name: Checkout repository
        id: repository_checkout
        uses: actions/checkout@v7

      # Make sure important project setup files are present
      - name: Verify required setup files
        id: required_setup_files
        shell: bash
        run: |
          test -f README.md
          test -f .env.example
          test -f docker-compose.yml
          test -f .gitignore

      # Prevent developers from accidentally committing the real local .env file
      - name: Ensure local env file is not committed
        id: local_env_not_committed
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Error: .env must not be committed."
            exit 1
          fi

      # Keep Telegram notification inside this existing CI check.
      # On successful CI this step is merely skipped inside the job and does not
      # appear as a separate PR check.
      - name: Notify Telegram on CI failure
        if: ${{ always() && (needs.backend.result == 'failure' || needs.frontend.result == 'failure' || steps.repository_checkout.outcome == 'failure' || steps.required_setup_files.outcome == 'failure' || steps.local_env_not_committed.outcome == 'failure') }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          REPOSITORY_CHECKS_FAILED: ${{ steps.repository_checkout.outcome == 'failure' || steps.required_setup_files.outcome == 'failure' || steps.local_env_not_committed.outcome == 'failure' }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets are required."
            exit 1
          fi

          failed_jobs=()
          [ "$BACKEND_RESULT" = "failure" ] && failed_jobs+=("Backend")
          [ "$FRONTEND_RESULT" = "failure" ] && failed_jobs+=("Frontend")
          [ "$REPOSITORY_CHECKS_FAILED" = "true" ] && failed_jobs+=("Repository Checks")
          failed_list="$(IFS=', '; echo "${failed_jobs[*]}")"

          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="$(printf '❌ CI FAILED\n\nRepository: %s\nBranch: %s\nFailed: %s\nBy: @%s\n\n%s' \
            "$GITHUB_REPOSITORY" "$branch_name" "$failed_list" "$GITHUB_ACTOR" "$run_url")"

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"
