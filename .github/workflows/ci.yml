name: CI

# Run CI for pull requests targeting main
# and again whenever code is pushed/merged into main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI only needs permission to read repository contents
permissions:
  contents: read

jobs:
  backend:
    name: Backend - Test and Build
    runs-on: ubuntu-latest

    # Start a temporary PostgreSQL service for backend tests
    # This database exists only for this GitHub Actions run
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: techadvisor
          POSTGRES_USER: techadvisor
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432

        # Wait until PostgreSQL is ready before running backend tests
        options: >-
          --health-cmd "pg_isready -U techadvisor -d techadvisor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Environment variables used by Spring Boot to connect
    # to the temporary PostgreSQL service above
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: techadvisor
      POSTGRES_USER: techadvisor
      POSTGRES_PASSWORD: devpassword

    steps:
      # Download the repository onto the GitHub Actions runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Java 21 for the Spring Boot backend
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Run backend tests first, then build the application
      - name: Test and build backend
        shell: bash
        run: |
          # Allow CI to continue before the Spring Boot backend exists
          if [ ! -f backend/pom.xml ]; then
            echo "backend/pom.xml not found yet - backend CI skipped until Spring Boot is initialised."
            exit 0
          fi

          cd backend

          # Prefer the Maven Wrapper so developers do not need
          # the same Maven version installed manually
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw test
            ./mvnw package -DskipTests
          else
            mvn test
            mvn package -DskipTests
          fi

  frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the GitHub Actions runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Node.js for the React/TypeScript frontend
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Install dependencies, run available tests, and build the frontend
      - name: Test and build frontend
        shell: bash
        run: |
          # Allow CI to continue before the React frontend exists
          if [ ! -f frontend/package.json ]; then
            echo "frontend/package.json not found yet - frontend CI skipped until React is initialised."
            exit 0
          fi

          cd frontend

          # Use npm ci when a lock file exists for reproducible installs
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          # Run tests
          npm test
          npm run build

  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      # Download the repository so setup files can be checked
      - name: Checkout repository
        uses: actions/checkout@v7

      # Make sure important project setup files are present
      - name: Verify required setup files
        shell: bash
        run: |
          test -f README.md
          test -f .env.example
          test -f docker-compose.yml
          test -f .gitignore

      # Prevent developers from accidentally committing the real local .env file
      - name: Ensure local env file is not committed
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Error: .env must not be committed."
            exit 1
          fi