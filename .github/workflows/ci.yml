name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and build backend
        shell: bash
        run: |
          if [ ! -f backend/pom.xml ]; then
            echo "backend/pom.xml not found yet - backend CI skipped until Spring Boot is initialised."
            exit 0
          fi

          cd backend

          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw test
            ./mvnw package -DskipTests
          else
            mvn test
            mvn package -DskipTests
          fi

  frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test and build frontend
        shell: bash
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "frontend/package.json not found yet - frontend CI skipped until React is initialised."
            exit 0
          fi

          cd frontend

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm run test --if-present
          npm run build --if-present

  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required setup files
        shell: bash
        run: |
          test -f README.md
          test -f .env.example
          test -f docker-compose.yml
          test -f .gitignore

      - name: Ensure local env file is not committed
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Error: .env must not be committed."
            exit 1
          fi
