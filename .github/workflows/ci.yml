name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: techadvisor
          POSTGRES_USER: techadvisor
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techadvisor -d techadvisor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: techadvisor
      POSTGRES_USER: techadvisor
      POSTGRES_PASSWORD: devpassword

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and build backend
        shell: bash
        run: |
          if [ ! -f backend/pom.xml ]; then
            echo "backend/pom.xml not found yet - backend CI skipped until Spring Boot is initialised."
            exit 0
          fi

          cd backend

          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw test
            ./mvnw package -DskipTests
          else
            mvn test
            mvn package -DskipTests
          fi

  frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test and build frontend
        shell: bash
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "frontend/package.json not found yet - frontend CI skipped until React is initialised."
            exit 0
          fi

          cd frontend

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm run test --if-present
          npm run build --if-present

  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify required setup files
        shell: bash
        run: |
          test -f README.md
          test -f .env.example
          test -f docker-compose.yml
          test -f .gitignore

      - name: Ensure local env file is not committed
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Error: .env must not be committed."
            exit 1
          fi
