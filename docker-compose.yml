services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: tech-advisor-postgres
    restart: unless-stopped
    environment:
      # Interpolated from the repo-root .env. Listed explicitly rather than
      # pulled in wholesale with `env_file` so this container sees only what
      # it needs - not the Anthropic key, not JWT_SECRET, not the VITE_ vars.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai
    container_name: tech-advisor-ai
    restart: unless-stopped
    environment:
      # Same rule as postgres: interpolated from the repo-root .env, listed
      # explicitly. Inside the container there is no repo root to read, so the
      # process environment is the whole story.
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      VECTOR_STORE: ${VECTOR_STORE:-local}
      EMBEDDER: ${EMBEDDER:-model2vec}
      # Reaches postgres over the compose network by service name, so the
      # host port mapping (5433) is irrelevant in here.
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AI_PORT:-8000}:8000"
    volumes:
      # Stand-in vector store: drop chunk JSON here without rebuilding.
      - ./ai/data/vector_store:/srv/data/vector_store

volumes:
  postgres_data:
