# fly.toml app configuration file generated for tech-advisor-backend on 2026-09-06T11:24:15+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tech-advisor-backend'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/actuator/health"
  protocol = "http"

  [http_service.checks.headers]
    X-Forwarded-Proto = "https"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
