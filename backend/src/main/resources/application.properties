spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${POSTGRES_DB:techadvisor}
spring.datasource.username=${POSTGRES_USER:techadvisor}
spring.datasource.password=${POSTGRES_PASSWORD:devpassword}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Expose only the health endpoint for deployment monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Allow API requests from frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Configure an explicit UTC anchor and enabled sources before enabling live scheduling.
ingestion.scheduling-enabled=${INGESTION_SCHEDULING_ENABLED:false}
ingestion.anchor=${INGESTION_ANCHOR:2026-09-17T05:00:00Z}
ingestion.enabled-sources=${INGESTION_ENABLED_SOURCES:}

# Ticket 1.2 — MobileAPI.dev smartphone source (https://mobileapi.dev/docs/).
# Deliberately NOT in ingestion.enabled-sources above: no production catalogue
# sink exists yet for Specifications/Price payloads. Registered as a bean so
# it's ready to enable the moment a real sink lands; empty by default so
# startup never fails without these being set.
# sources.mobileapi.year: optional, e.g. 2024 -> GET /devices/by-year/?year=2024.
# Left blank -> GET /devices/?limit=10 (no year filter).
sources.mobileapi.api-key=${MOBILEAPI_API_KEY:}
sources.mobileapi.year=${MOBILEAPI_YEAR:}
