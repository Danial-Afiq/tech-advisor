spring.application.name=backend

# The repo-root .env is the project's single source of truth, but placeholders
# below resolve from the *environment*, not from that file - so without this
# import a plain `mvnw test` on the host silently falls back to every default
# here and can target the wrong database entirely.
#
# `optional:` means a missing .env is fine: CI and the Fly.io image export real
# environment variables instead, and OS environment variables still take
# precedence over anything in the file. The path is relative to the working
# directory, i.e. backend/ when running Maven.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${POSTGRES_DB:techadvisor}
spring.datasource.username=${POSTGRES_USER:techadvisor}
spring.datasource.password=${POSTGRES_PASSWORD:devpassword}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Expose only the health endpoint for deployment monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Fly health polling must not query/wake Neon. DB availability is checked on actual requests.
management.health.db.enabled=${MANAGEMENT_HEALTH_DB_ENABLED:false}

# Browsable Spring Boot API contract used for local development and demos.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Allow API requests from frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Configure an explicit UTC anchor and enabled sources before enabling live scheduling.
ingestion.scheduling-enabled=${INGESTION_SCHEDULING_ENABLED:false}
ingestion.anchor=${INGESTION_ANCHOR:2026-09-17T05:00:00Z}
ingestion.enabled-sources=${INGESTION_ENABLED_SOURCES:}

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# AI layer client. The provider key stays with the AI service; Spring only
# needs the base URL and the shared bearer secret (AGENTS.md 20.3).
ai.service-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service-token=${AI_SERVICE_TOKEN:}
ai.timeout=${AI_TIMEOUT:30s}

# Deterministic upgrade classification (AGENTS.md §7.1).
# upgrade-score is 0-1: 1.0 is a strong upgrade recommendation, 0.0 is not
# recommended. Starting values below, NOT a settled product decision: §27.5
# records scoring weights and band thresholds as unresolved, pending calibration
# against representative product pairs. Bump scoring-version whenever any value
# below changes, or previously persisted analyses stop being explainable.
# This block is the single source of truth for these values: unit tests bind
# it directly (ShippedScoringSettings), so do not restate the numbers elsewhere.
recommendation.scoring.scoring-version=${SCORING_VERSION:v3}
recommendation.scoring.watching-threshold=${SCORING_WATCHING_THRESHOLD:0.50}
recommendation.scoring.considering-threshold=${SCORING_CONSIDERING_THRESHOLD:0.67}
recommendation.scoring.strong-threshold=${SCORING_STRONG_THRESHOLD:0.83}
recommendation.scoring.min-spec-coverage=${SCORING_MIN_SPEC_COVERAGE:0.34}
recommendation.scoring.score-precision=${SCORING_SCORE_PRECISION:2}

# Recommendation triggers (AGENTS.md §18.12). When false, the device-inventory and
# market-event triggers still write deterministic verdicts but never call
# POST /assess; skipped pairs are counted in the run's system_log row.
recommendation.triggers.ai-assessment-enabled=${RECOMMENDATION_AI_ASSESSMENT_ENABLED:true}
# Fixed administrator account
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
# Ticket 1.2 — MobileAPI.dev smartphone source (https://mobileapi.dev/docs/).
# Deliberately NOT in ingestion.enabled-sources above: sources.mobileapi.api-key
# hasn't actually been provisioned yet. SmartphoneCatalogSink now exists (writes
# to products/phone) - the blocker is the API key, not a missing sink anymore.
# sources.mobileapi.year: optional, e.g. 2024 -> GET /devices/by-year/?year=2024.
# Left blank -> GET /devices/?limit=10 (no year filter).
sources.mobileapi.api-key=${MOBILEAPI_API_KEY:}
sources.mobileapi.year=${MOBILEAPI_YEAR:}

# SCRUM-124 — raw Geekbench fields from TechAPI's released GitHub main dataset.
# The token is optional but raises GitHub's API rate limit. The source remains
# opt-in through INGESTION_ENABLED_SOURCES=techapi-soc-benchmarks.
sources.techapi.github-token=${TECHAPI_GITHUB_TOKEN:}
# Retained environment-variable name; this bounds source records or new phones per run.
sources.techapi.max-products-per-run=${TECHAPI_MAX_PRODUCTS_PER_RUN:20}

# Ticket 1.4 (SearchAPI branch) — external owner evidence, opt-in through
# ingestion.enabled-sources.
searchapi.api-key=${SEARCHAPI_API_KEY:}
searchapi.gl=${SEARCHAPI_GL:sg}
searchapi.hl=${SEARCHAPI_HL:en}
searchapi.location=${SEARCHAPI_LOCATION:Singapore}
searchapi.max-products-per-run=${SEARCHAPI_MAX_PRODUCTS_PER_RUN:3}
# Ticket 1.3 — catalogue categories SearchAPI collects reviews for (SMARTPHONE and/or GPU).
searchapi.categories=${SEARCHAPI_CATEGORIES:SMARTPHONE,GPU}
ai.ingestion-embedder=${AI_INGESTION_EMBEDDER:minishlab/potion-retrieval-32M}

# Ticket 1.4 (revised) — HardwareZone SG smartphone/GPU review source.
# COMMENTED OUT 28 Sep 2026 - superseded by the SearchAPI approach
# (feat/searchapi-review-ingestion). HardwareZoneReviewSource/Parser and
# their tests are commented out (not deleted) in the ingestion package -
# kept in case they're wanted again. See AGENTS.md 17.1.2.

# Ticket 4.4.2 - in-app notifications. Each user keeps only their newest N;
# creating one more deletes the oldest, read or not. See AGENTS.md 14.14.
notifications.max-per-user=${NOTIFICATIONS_MAX_PER_USER:10}

# Ticket 1.3 — GPU catalogue sources, both opt-in through ingestion.enabled-sources and
# needing no keys: gpu-seed (12 starter cards from seed/gpus.v1.json, adds only missing
# ones) and techspot-gpu-specs (one TechSpot list page plus up to 8 spec pages per run,
# 5 s apart, resuming from ingestion_cursors; a full sweep then waits 7 days).

# Ticket 1.3 — GPU spec sanity ranges (catch parse errors, not judge cards)
gpu.validation.base-clock-min-mhz=100
gpu.validation.base-clock-max-mhz=4000
gpu.validation.vram-min-gb=0.5
gpu.validation.vram-max-gb=96
gpu.validation.tdp-min-watts=10
gpu.validation.tdp-max-watts=1000
gpu.validation.msrp-min-usd=50
gpu.validation.msrp-max-usd=5000
gpu.validation.min-release-year=2010
# Backslashes are doubled because .properties treats a single one as an escape.
gpu.validation.excluded-name-pattern=(?i)\\b(laptop|mobile|max-q|notebook|quadro|tesla|instinct|radeon pro|firepro|rtx a\\d+|ada generation)\\b

# Number of days a dismissed product is excluded for that user.
recommendation.dismissal.cooldown-days=${RECOMMENDATION_DISMISSAL_COOLDOWN_DAYS:30}

# High-confidence recommendation email delivery.
recommendation.email.eligible-verdict=${RECOMMENDATION_EMAIL_ELIGIBLE_VERDICT:STRONG_UPGRADE_CANDIDATE}
recommendation.email.minimum-grade=${RECOMMENDATION_EMAIL_MINIMUM_GRADE:B}
recommendation.email.maximum-attempts=${RECOMMENDATION_EMAIL_MAXIMUM_ATTEMPTS:3}
recommendation.email.frontend-recommendation-url=${RECOMMENDATION_EMAIL_FRONTEND_URL:http://localhost:5173/dashboard}
recommendation.email.from-address=${RECOMMENDATION_EMAIL_FROM_ADDRESS:no-reply@techadvisor.local}

# SMTP provider used to deliver high-confidence recommendation emails.
# Local defaults expect a development mail catcher on port 1025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:false}

# Email delivery is non-critical and must not make the application health endpoint fail.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
