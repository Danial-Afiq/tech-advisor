spring.application.name=backend

# The repo-root .env is the project's single source of truth, but placeholders
# below resolve from the *environment*, not from that file - so without this
# import a plain `mvnw test` on the host silently falls back to every default
# here and can target the wrong database entirely.
#
# `optional:` means a missing .env is fine: CI and the Fly.io image export real
# environment variables instead, and OS environment variables still take
# precedence over anything in the file. The path is relative to the working
# directory, i.e. backend/ when running Maven.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${POSTGRES_DB:techadvisor}
spring.datasource.username=${POSTGRES_USER:techadvisor}
spring.datasource.password=${POSTGRES_PASSWORD:devpassword}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Expose only the health endpoint for deployment monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Allow API requests from frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Configure an explicit UTC anchor and enabled sources before enabling live scheduling.
ingestion.scheduling-enabled=${INGESTION_SCHEDULING_ENABLED:false}
ingestion.anchor=${INGESTION_ANCHOR:2026-09-17T05:00:00Z}
ingestion.enabled-sources=${INGESTION_ENABLED_SOURCES:}

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# AI layer client. The provider key stays with the AI service; Spring only
# needs the base URL and the shared bearer secret (AGENTS.md 20.3).
ai.service-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service-token=${AI_SERVICE_TOKEN:}
ai.timeout=${AI_TIMEOUT:30s}

# External owner evidence is opt-in through ingestion.enabled-sources.
searchapi.api-key=${SEARCHAPI_API_KEY:}
searchapi.gl=${SEARCHAPI_GL:sg}
searchapi.hl=${SEARCHAPI_HL:en}
searchapi.location=${SEARCHAPI_LOCATION:Singapore}
searchapi.max-products-per-run=${SEARCHAPI_MAX_PRODUCTS_PER_RUN:1}
ai.ingestion-embedder=${AI_INGESTION_EMBEDDER:minishlab/potion-retrieval-32M}
