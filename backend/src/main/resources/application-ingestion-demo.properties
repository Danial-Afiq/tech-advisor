# Local demonstration only - enables the simulated data sources so the
# ingestion admin UI has something to run without real API keys. Admin
# access itself uses the real ROLE_ADMIN JWT login, not a profile-specific
# credential (see AdminAccountInitializer/AdminAuthController). Overridable
# so a live local demo can opt real sources (mobileapi-smartphone,
# searchapi-google-product-reviews) in alongside the simulated ones.
ingestion.enabled-sources=${INGESTION_ENABLED_SOURCES:simulated-release,simulated-failure}
server.address=127.0.0.1
# Daily local run at 13:00 SGT, beginning 17 September 2026.
ingestion.scheduling-enabled=${INGESTION_SCHEDULING_ENABLED:true}
