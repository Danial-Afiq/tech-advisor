# fly.toml app configuration file generated for tech-advisor-ai on 2026-10-11T03:50:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tech-advisor-ai'
primary_region = 'sin'

[build]

# Non-sensitive runtime configuration; API keys and database credentials stay in Fly secrets.
[env]
  LLM_PROVIDER = 'openai'
  LLM_MODEL = 'gpt-5.4'
  VECTOR_STORE = 'pgvector'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# HTTP readiness check used during deploys and by Fly Proxy.
[[http_service.checks]]
  grace_period = '60s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
